# Alternative to Cloudflare Tunnel: Cloudflare proxied DNS (orange cloud) -> nginx on this server.
# SSL/TLS mode "Full (strict)" with a Cloudflare Origin Certificate saved at the paths below.
# Allow ports 80/443 only from Cloudflare IP ranges (https://www.cloudflare.com/ips/) in the firewall.
server {
  listen 443 ssl http2;
  server_name strata-pos.itdev.in.th;
  ssl_certificate     /etc/ssl/cloudflare/origin.pem;
  ssl_certificate_key /etc/ssl/cloudflare/origin.key;
  client_max_body_size 40m;

  location / {
    proxy_pass http://127.0.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # live dashboard (WebSocket)
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
server {
  listen 80;
  server_name strata-pos.itdev.in.th;
  return 301 https://$host$request_uri;
}
