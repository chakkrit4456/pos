# FlexPOS Cloud + PostgreSQL 17 on a store's own server.
#   1) set POSTGRES_PASSWORD and JWT_SECRET below (JWT_SECRET: 40+ random characters)
#   2) docker compose -f docker-compose.cloud.yml up -d
#   3) docker compose -f docker-compose.cloud.yml exec cloud node main.js create-superadmin --email admin --password '...'
#      then sign in on the web and create the manager account(s); POS machines connect with them
#   4) put HTTPS in front (Cloudflare Tunnel, nginx, Caddy) and enter that https:// address on the POS
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexpos_cloud
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: flexpos_cloud
    volumes:
      - cloud-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flexpos_cloud']
      interval: 5s
      retries: 10
  cloud:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://flexpos_cloud:change-me@db:5432/flexpos_cloud
      JWT_SECRET: change-me-to-a-long-random-secret-at-least-40-chars
    ports:
      - '4200:4200'
    volumes:
      - cloud-data:/data
volumes:
  cloud-pg:
  cloud-data:
